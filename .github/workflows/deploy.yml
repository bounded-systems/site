name: deploy

# Two-phase, promote-the-artifact pipeline, in deferred_sign order (site#243):
# stage → approve → sign → release.
#   build   — hermetic nix build → keyless-sign the BLOB provenance (whole-site
#             manifest, SBOM, in-toto — build provenance stays signed at build) →
#             publish a fully-deployable but UNSIGNED, digest-pinned OCI artifact
#             to GHCR (staged, not released).
#   deploy  — stage the artifact as an un-served preview, verify it at the
#             version's own URL, pass the human gate — and only then does the
#             gate-holding lane mint the artifact's first and only signature,
#             which the release leg re-verifies before prod routes to it. So
#             "unsigned" and "unreleased" are the same fact: a rejected build
#             never acquires a signature, and a signature can only exist for an
#             approved artifact. Fail-closed at every leg.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: lets cosign mint a keyless Fulcio cert for build provenance
  packages: write # build pushes the artifact; the callee's post-approval cosign sign pushes the signature (its declared block intersects, so the grant must originate here)
  issues: write # the promote ceremony's notification issue (the callee's declared block intersects, so the grant must originate here)

concurrency:
  group: deploy-${{ github.ref }}
  # A run stuck waiting at the site-promote approval gate (never approved or
  # rejected) otherwise blocks every subsequent deploy indefinitely. promote's
  # only prod-affecting step (wrangler versions deploy, in the shared
  # site-deploy.yml) is a single atomic Cloudflare routing switch, not a
  # multi-step process that can be left half-applied; cancelling mid-promote
  # can at worst interrupt the post-switch verification for that one run, not
  # corrupt what's already live.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      oci: ${{ steps.publish.outputs.oci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Hermetic build: nodejs + brand are pinned by flake.lock. Same bytes on
      # every machine; runs the brand token-drift check, then assembles dist/.
      - name: Build (nix)
        run: nix build .#site -L

      - name: Stage dist
        run: cp -rL result dist && chmod -R u+w dist


      # main only: content-address the whole site, keyless-sign that manifest
      # (no stored key — the Actions OIDC identity mints a one-build Fulcio cert,
      # logged in Rekor), write /provenance.json, then publish the WHOLE dist/
      # (site + provenance sidecars) to GHCR as one deployable OCI artifact.
      # The blob signatures here are BUILD provenance and stay; the artifact
      # itself leaves this job UNSIGNED (deferred_sign, site#243) — its first
      # and only signature is minted by the deploy lane after the human gate.
      # The deploy job stages exactly this digest.
      - name: Publish the OCI artifact (blob provenance signed; artifact unsigned → GHCR)
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_REPO: ghcr.io/bounded-systems/bounded-tools-site
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          nix develop .#deploy --command bash -euo pipefail -c '
            short=$(printf "%s" "$GITHUB_SHA" | cut -c1-7)
            # The `stamped` half of scripts/pipeline.mjs — the steps that embed the
            # build date or the deploying commit and so cannot live inside the pure
            # nix derivation. It stamps the honesty section, re-asserts the vendor
            # pin and the SBOM, emits the standards sidecars (RFC 9116 security.txt,
            # web app manifest, RFC 9530 Repr-Digest _headers), emits the served
            # claims + structured-data graphs, and ends with the whole-site manifest
            # — so every one of those is a signed subject rather than an unsigned
            # afterthought. The list lives in pipeline.mjs, never restated here.
            node scripts/run-pipeline.mjs stamped
            cosign sign-blob --yes --bundle dist/site.sha256.sigstore.json dist/site.sha256
            # also keyless-sign the SBOM blob itself, so it carries its own verifiable
            # Sigstore bundle alongside being a subject of the signed site manifest
            cosign sign-blob --yes --bundle dist/sbom.spdx.json.sigstore.json dist/sbom.spdx.json
            # /provenance.json (Rekor index from the bundle; OCI digest resolved at verify)
            OCI_REF="$GHCR_REPO:$short" node scripts/gen-provenance.mjs
            # pack the WHOLE dist/ (site + provenance sidecars) → one deployable artifact
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -C dist -cf site.tar .
            gzip -n -f site.tar
            printf "%s" "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            oras push "$GHCR_REPO:$short" \
              --artifact-type application/vnd.bounded.site.v1+gzip \
              site.tar.gz:application/gzip | tee oras-push.log
            oras tag "$GHCR_REPO:$short" latest
            digest=$(awk "/Digest:/ {print \$2}" oras-push.log)
            # no artifact-level cosign sign here: deferred_sign moves it after
            # the promote gate (site#243), so approval gates the signature
            echo "oci=$GHCR_REPO@$digest" >> "$GITHUB_OUTPUT"
          '


  # DEPLOY: hand the staged, digest-pinned artifact to the CANONICAL reusable pipeline (preview →
  # deterministic preview-URL verify → gated promote, which signs the artifact only after the
  # gate) — the same source of truth as robertdelanghe.dev. The
  # required-reviewers `site-promote` Environment lives in THIS repo, so approval is enforced here.
  # This ADDS an approval gate bounded.tools didn't have before (was straight build→deploy).
  # Pinned by SHA per the repo's "every action pinned by SHA" posture. A SHA pin does not
  # track .github main, so it only moves when bumped here deliberately — this one carries
  # deferred_sign (site#243: sign AFTER the human gate, over #251's Face ID promote gate,
  # atop #171's per-role broker routes and #172's id-token fix), which is the exact ref
  # the broker's WORKERS_DEPLOY entries pin (infra#504): any other SHA fails the mint 401.
  #
  # No stored Cloudflare credential: the callee mints a per-run token from the OIDC broker
  # (infra#336 option (a)). The URL is a literal, not vars.CF_BROKER_URL, so this public
  # caller cannot silently break on org-variable visibility; infra's target-host guard pins
  # the same hostname. The callee appends the job role itself — preview POSTs
  # /deploy/bounded-tools-site-preview, promote /deploy/bounded-tools-site-promote — so the
  # path here stays role-less. `site-preview` auto-creates unprotected on first run: that is
  # deliberate (a broker pin, not a gate); required reviewers stay on `site-promote` only.
  deploy:
    needs: build
    if: needs.build.outputs.oci != ''
    uses: bounded-systems/.github/.github/workflows/site-deploy.yml@d2e102169f941ceb04ad4c33e0686e0d3a2e633b # .github main (deferred_sign, site#243 — over #251's Face ID promote gate)
    with:
      oci: ${{ needs.build.outputs.oci }}
      domain: "https://bounded.tools"
      # deferred_sign (site#243): build pushes the artifact UNSIGNED and digest-pinned;
      # preview runs pre-signature and rests on the run's own digest, and promote mints
      # the artifact's first and only signature after the human gate.
      deferred_sign: true
      # The post-approval signer is the gate-holding lane's job_workflow_ref — the shared
      # site-deploy workflow itself, not this repo's build lane — and promote keeps full
      # verification of that fresh signature before anything routes.
      identity_regexp: "^https://github.com/bounded-systems/.github/.github/workflows/site-deploy.yml@"
      cf_broker_url: "https://broker.bounded.tools"
      cf_broker_path: /deploy/bounded-tools-site
      # The promote gate is a Face ID ceremony (infra#480): the callee opens a ceremony
      # pinning the run and commit, the notification issue carries the verified preview
      # URL, and the promote credential is minted only after a fail-closed redeem. With
      # this set, the site-promote Environment's required reviewers become redundant —
      # removing them is a repo-settings toggle recorded in the PR that added this line.
      keeper_url: "https://keeper.bounded.tools"
