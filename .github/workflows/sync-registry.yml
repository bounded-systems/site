name: sync-registry

# The @bounded-systems knowledge-graph section on the homepage is generated from
# data/registry.json (scripts/gen-registry.mjs). Kept honest two ways:
#   • on PRs — fail if the committed section is stale or hand-edited (offline gate)
#   • daily / on demand — refresh labels from each package's bounded.* and, if
#     anything changed, open a PR. Mirrors sync-seams.yml.

on:
  pull_request:
    paths:
      - "index.html"
      - "data/registry.json"
      - "scripts/gen-registry.mjs"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Offline, deterministic, two halves. The seed must be well-formed (every node
  # declares its labels, every edge names real nodes), and the page that renders
  # it must equal render(seed). Those used to be one check against a summary
  # spliced into index.html; the homepage no longer carries one, and /map renders
  # the registry in full, so the rendering half is gen-map's.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/gen-registry.mjs --check
      - run: node scripts/gen-map.mjs --check

  # Networked: refresh labels from each package's bounded.* (per-repo), regenerate,
  # open a PR on any change. No-op until/unless a package's bounded.* changes.
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh labels from each package's bounded.* and re-render /map
        run: |
          node scripts/gen-registry.mjs --from-bounded
          node scripts/gen-map.mjs
      - name: Open PR if the section changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change — registry section already in sync."
            exit 0
          fi
          branch="registry-sync/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(registry): sync knowledge-graph section from package bounded.*"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(registry): sync knowledge-graph section from package bounded.*" \
            --body "Automated by .github/workflows/sync-registry.yml. A package's bounded.* changed — review and merge."
