name: derived-facts
# Derive org facts from the signed lattice. NO signing — a derived fact re-derives
# itself (its basis is the recompute), so a signature adds nothing. Nudged on a
# schedule + lattice update; opens a PR when the value changes (sign-on-change).
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [lattice-updated]
permissions:
  contents: write
  pull-requests: write
jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: bounded-systems/synoptic, ref: v0.5.0, path: .synoptic, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: node .synoptic/derive.mjs data/derive.model.json --out data/derived-facts.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          branch: chore/refresh-derived-facts
          # Commit ONLY the derived facts. The synoptic checkout above lands at
          # .synoptic inside the workspace, and an untracked nested git repo is
          # staged by `git add -A` as a gitlink (mode 160000) with no .gitmodules
          # entry — which is the entire content of the PRs this lane has been
          # opening. Scoping the commit keeps the lane to the file it derives.
          add-paths: data/derived-facts.json
          title: "chore: refresh derived facts (recomputed, unsigned)"
          commit-message: "chore: refresh derived facts from the signed lattice"
          body: "Recomputed org facts. No signature — a derived fact's basis is the recompute."
